name: Release unsigned iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: forma-ios-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      commit: ${{ steps.target.outputs.commit }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - name: Resolve and validate the existing tag
        id: target
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        with:
          script: |
            const tag = process.env.REQUESTED_TAG;
            if (typeof tag !== 'string' || tag.trim() !== tag || !/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) {
              throw new Error('Expected an existing version tag such as v0.1.0.');
            }
            let object = (await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` })).data.object;
            for (let depth = 0; object.type === 'tag' && depth < 10; depth++) {
              object = (await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha })).data.object;
            }
            if (object.type !== 'commit' || !/^[0-9a-f]{40}$/.test(object.sha)) throw new Error('Tag must resolve to a commit.');
            core.setOutput('tag', tag);
            core.setOutput('commit', object.sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Test release validation
        run: node --test scripts/release/common.test.mjs
      - name: Validate version and skip an already complete release
        id: release
        run: node scripts/release/preflight.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          COMMIT_SHA: ${{ steps.target.outputs.commit }}
      - name: Install locked dependencies
        if: steps.release.outputs.skip != 'true'
        run: npm ci
      - name: Check TypeScript
        if: steps.release.outputs.skip != 'true'
        run: npm run typecheck
      - name: Check workout persistence, backups and calculations
        if: steps.release.outputs.skip != 'true'
        run: npm test
      - name: Check native app identity before spending macOS minutes
        if: steps.release.outputs.skip != 'true'
        run: node scripts/release/validate-config.mjs
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
      - name: Verify native generation without changing locked dependencies
        if: steps.release.outputs.skip != 'true'
        run: |
          npx expo prebuild -p ios --no-install
          git diff --exit-code -- package.json package-lock.json
          test -f ios/Forma.xcodeproj/project.pbxproj

  build:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      COMMIT_SHA: ${{ needs.preflight.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Archive, package and verify unsigned device app
        run: node scripts/release/build-ios.mjs
        env:
          RELEASE_DIR: ${{ runner.temp }}/forma-release-output
      - name: Transfer verified output to publication job
        uses: actions/upload-artifact@v4
        with:
          name: forma-${{ needs.preflight.outputs.tag }}-${{ needs.preflight.outputs.commit }}
          path: ${{ runner.temp }}/forma-release-output/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: forma-${{ needs.preflight.outputs.tag }}-${{ needs.preflight.outputs.commit }}
          path: ${{ runner.temp }}/forma-release-output
      - name: Publish verified assets through a draft release
        run: node scripts/release/publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          COMMIT_SHA: ${{ needs.preflight.outputs.commit }}
          RELEASE_DIR: ${{ runner.temp }}/forma-release-output
